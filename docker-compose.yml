services:
  backend:
    build: ./backend
    environment:
      - DATA_DIR=/data
      # Optional: mirror the .nc files from a directory listing on every start.
      # - DATA_URL=https://data.up.ethz.ch/shared/mapmaker/mapmaker_js/backend/data/
      # Gunicorn worker processes; see backend/gunicorn_config.py.
      # - WEB_CONCURRENCY=3
    volumes:
      - ./backend/data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
