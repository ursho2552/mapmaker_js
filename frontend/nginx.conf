server {
    listen 80;
    server_name localhost;

    # Map and globe responses are several hundred KB of JSON; they compress well.
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # Hashed build assets, safe to cache for a year.
    location /static/ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location /api {
        # 'backend' is the service name in docker-compose.yml.
        proxy_pass http://backend:5000;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the single-page React app.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
